{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | TrackEase Admin Panel{% endblock %}

{% block extrastyle %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<style>
    :root {
        --railway-blue: #0A3D62;
        --railway-accent: #E84118;
    }
    
    #header {
        background-color: var(--railway-blue);
        color: white;
    }
    #header a:link, #header a:visited {
        color: white;
    }
    div.breadcrumbs {
        background: #f8f9fa;
        color: #333;
        border-bottom: 1px solid #ddd;
    }
    div.breadcrumbs a {
        color: var(--railway-blue);
    }
    .module h2, .module caption, .inline-group h2 {
        background: var(--railway-blue);
    }
    .button, input[type=submit], input[type=button], .submit-row input, a.button {
        background: var(--railway-blue);
    }
    .button:hover, input[type=submit]:hover, input[type=button]:hover {
        background: var(--railway-accent);
    }
    .button.default, input[type=submit].default, .submit-row input.default {
        background: var(--railway-accent);
    }
    
    /* Modern Dashboard Cards */
    .admin-stat-card {
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: transform 0.2s;
        border-left: 5px solid var(--railway-blue);
    }
    .admin-stat-card:hover {
        transform: translateY(-5px);
    }
    .admin-stat-icon {
        font-size: 2.5rem;
        color: var(--railway-blue);
        opacity: 0.8;
    }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}">
        <i class="bi bi-train-front-fill me-2"></i> TrackEase Admin
    </a>
</h1>
{% endblock %}
