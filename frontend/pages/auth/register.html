<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Registration | TrackEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="../../css/premium.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="text-center mb-4">
                    <a href="../../index.html" class="text-decoration-none text-railway fs-2 fw-bold">
                        <i class="bi bi-train-front"></i> TrackEase
                    </a>
                </div>
                
                <div class="clean-card p-5">
                    <h3 class="fw-bold text-dark text-center mb-1">Create an Account</h3>
                    <p class="text-muted text-center small fw-bold mb-4">Passenger Registration</p>
                    
                    <div id="regError" class="alert alert-danger d-none rounded-2 text-center fw-bold small"></div>
                    <div id="regSuccess" class="alert alert-success d-none rounded-2 text-center fw-bold small">Registration successful! Redirecting to login...</div>
                    
                    <form id="regForm">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label text-dark fw-bold small">First Name</label>
                                <input type="text" class="form-control clean-input" id="firstName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark fw-bold small">Last Name</label>
                                <input type="text" class="form-control clean-input" id="lastName" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-dark fw-bold small">Email Address</label>
                            <input type="email" class="form-control clean-input" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-dark fw-bold small">Mobile Number (Optional)</label>
                            <input type="text" class="form-control clean-input" id="phone" pattern="[0-9]{10}">
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-dark fw-bold small">Password</label>
                            <input type="password" class="form-control clean-input" id="password" required>
                        </div>
                        
                        <button type="submit" class="btn btn-railway w-100 py-2 fs-6" id="regBtn">Register Passenger</button>
                    </form>
                    
                    <div class="text-center mt-4 border-top pt-4">
                        <p class="text-muted small mb-0">Already have an account?</p>
                        <a href="login.html" class="btn btn-outline-primary btn-sm mt-2 fw-bold w-100">Log In Here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const payload = {
                username: email,
                first_name: document.getElementById('firstName').value,
                last_name: document.getElementById('lastName').value,
                email: email,
                phone_number: document.getElementById('phone').value,
                password: document.getElementById('password').value
            };
            
            const errorDiv = document.getElementById('regError');
            const successDiv = document.getElementById('regSuccess');
            const btn = document.getElementById('regBtn');
            
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing...';
            btn.disabled = true;

            fetch('http://127.0.0.1:8000/api/auth/register/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            })
            .then(async res => {
                const data = await res.json();
                if (!res.ok) {
                    let errStr = Object.values(data).flat().join(", ");
                    throw new Error(errStr || "Registration failed. Please try again.");
                }
                return data;
            })
            .then(data => {
                errorDiv.classList.add('d-none');
                successDiv.classList.remove('d-none');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            })
            .catch(err => {
                errorDiv.innerText = err.message;
                errorDiv.classList.remove('d-none');
                btn.innerText = "Register Passenger";
                btn.disabled = false;
            });
        });
    </script>


</body>
</html>
