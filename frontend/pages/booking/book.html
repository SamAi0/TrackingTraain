<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Trains | TrackEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="../../css/premium.css" rel="stylesheet">
    <script src="../../js/auth.js"></script>
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <div class="container mt-4 mb-5">
        <!-- Auth Check Alert -->
        <div id="authAlert" class="alert alert-danger d-none fw-bold text-center">
            You must be logged in to book a ticket. <a href="../auth/login.html" class="alert-link">Log in here</a>.
        </div>

        <div id="bookingContent" class="row justify-content-center d-none">
            <div class="col-lg-10">
                
                <!-- Search Trains Section -->
                <div class="clean-card mb-4">
                    <div class="card-header bg-white border-bottom py-3">
                        <h4 class="fw-bold text-railway mb-0"><i class="bi bi-search me-2"></i> Plan My Journey</h4>
                    </div>
                    <div class="card-body p-4">
                        <form id="searchForm">
                            <div class="row align-items-end">
                                <div class="col-md-3 mb-3">
                                    <label class="form-label text-muted small fw-bold">From Station</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-geo-alt text-railway"></i></span>
                                        <input type="text" class="form-control clean-input border-start-0 ps-0 autocomplete-input" id="source" data-target="sourceList" placeholder="Source (e.g. NDLS)" required autocomplete="off">
                                    </div>
                                    <ul class="dropdown-menu shadow-sm w-100" id="sourceList" style="max-height: 250px; overflow-y: auto;"></ul>
                                </div>
                                
                                <div class="col-md-1 mb-3 d-flex justify-content-center align-items-center pb-2">
                                    <button type="button" class="btn btn-light rounded-circle shadow-sm border"><i class="bi bi-arrow-left-right text-muted"></i></button>
                                </div>
                                
                                <div class="col-md-3 mb-3">
                                    <label class="form-label text-muted small fw-bold">To Station</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-geo text-railway"></i></span>
                                        <input type="text" class="form-control clean-input border-start-0 ps-0 autocomplete-input" id="destination" data-target="destinationList" placeholder="Destination (e.g. BCT)" required autocomplete="off">
                                    </div>
                                    <ul class="dropdown-menu shadow-sm w-100" id="destinationList" style="max-height: 250px; overflow-y: auto;"></ul>
                                </div>
                                
                                <div class="col-md-3 mb-3">
                                    <label class="form-label text-muted small fw-bold">Journey Date</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-calendar3 text-railway"></i></span>
                                        <input type="date" class="form-control clean-input border-start-0 ps-0" id="journeyDate" required>
                                    </div>
                                </div>
                                
                                <div class="col-md-2 mb-3">
                                    <button type="submit" class="btn btn-railway w-100 py-2 fs-6" id="searchBtn">Search</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div id="searchError" class="alert alert-warning mt-3 d-none fw-bold text-center"></div>
                
                <!-- Results Section -->
                <div class="clean-card mb-4 d-none" id="trainsList">
                    <div class="card-header bg-white border-bottom py-3">
                        <h5 class="fw-bold text-dark mb-0"><i class="bi bi-list-ul me-2 text-railway"></i> Available Trains</h5>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-clean table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Train Name & No.</th>
                                    <th>Departure</th>
                                    <th>Arrival</th>
                                    <th class="text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody id="trainsBody">
                                <!-- Populated via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Booking Form Section -->
                <div id="bookSection" class="clean-card d-none">
                    <div class="card-header bg-white border-bottom py-3">
                        <h4 class="fw-bold text-railway mb-0"><i class="bi bi-ticket-detailed me-2"></i> Passenger Details</h4>
                    </div>
                    <div class="card-body p-4">
                        <div class="alert alert-info border-0 rounded-0" style="background-color: #e3f2fd; color: #084298;">
                            <h5 class="fw-bold mb-1" id="selectedTrainTitle">Train Name</h5>
                            <p class="mb-0 fw-bold" id="selectedRouteInfo">SRC ➔ DST</p>
                        </div>
                        
                        <div id="bookError" class="alert alert-danger d-none fw-bold"></div>
                        <div id="bookSuccess" class="alert alert-success d-none fw-bold"></div>

                        <form id="bookForm">
                            <div class="table-responsive mt-4">
                                <table class="table table-bordered align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Passenger Name</th>
                                            <th width="15%">Age</th>
                                            <th width="25%" class="berth-col">Berth Preference</th>
                                            <th width="10%" class="text-center">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="passengersContainer">
                                        <tr class="passenger-row">
                                            <td><input type="text" class="form-control clean-input pass-name" placeholder="Full Name" required></td>
                                            <td><input type="number" class="form-control clean-input pass-age" placeholder="Age" min="1" max="120" required></td>
                                            <td class="berth-col">
                                                <select class="form-select clean-input pass-berth">
                                                    <option value="">No Preference</option>
                                                    <option value="LB">Lower</option>
                                                    <option value="MB">Middle</option>
                                                    <option value="UB">Upper</option>
                                                </select>
                                            </td>
                                            <td class="text-center">
                                                <button type="button" class="btn btn-outline-secondary btn-sm remove-pass-btn" disabled><i class="bi bi-trash"></i></button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            
                            
                            <div class="row align-items-center mt-3">
                                <div class="col-md-6 d-flex">
                                    <button type="button" class="btn btn-outline-primary fw-bold me-3" id="addPassengerBtn"><i class="bi bi-plus-circle me-1"></i> Add Passenger</button>
                                    
                                    <div id="classSelectorContainer" class="d-flex align-items-center">
                                        <label class="form-label mb-0 fw-bold me-2">Class:</label>
                                        <select class="form-select clean-input" id="ticketClass">
                                            <option value="SL">Sleeper (SL)</option>
                                            <option value="3A">AC 3-Tier (3A)</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6 text-end">
                                    <button type="submit" class="btn btn-railway px-5" id="confirmBookBtn">Confirm Booking</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>


    <!-- Route Modal -->
    <div class="modal fade" id="routeModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-railway text-white">
                    <h5 class="modal-title fw-bold" id="routeModalTitle">Train Route</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <div id="routeLoading" class="text-center py-4 d-none">
                        <div class="spinner-border text-railway" role="status"></div>
                    </div>
                    <ul class="list-group list-group-flush" id="routeList">
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedTrainId = null;
        let selectedTrainType = null;
        let selectedSrc = null;
        let selectedDst = null;

        document.addEventListener('DOMContentLoaded', function() {
            // Set default date to today
            const today = new Date().toISOString().split('T')[0];
            const dateInput = document.getElementById('journeyDate');
            if (dateInput) dateInput.value = today;
            
            const token = localStorage.getItem('access_token');
            if(!token) {
                document.getElementById('authAlert').classList.remove('d-none');
            } else {
                document.getElementById('bookingContent').classList.remove('d-none');
            }
        });

        // Add Passenger
        document.getElementById('addPassengerBtn').addEventListener('click', () => {
            const tbody = document.getElementById('passengersContainer');
            if(tbody.children.length >= 6) {
                alert("Maximum 6 passengers allowed per ticket.");
                return;
            }
            
            const tr = document.createElement('tr');
            tr.className = "passenger-row";
            tr.innerHTML = `
                <td><input type="text" class="form-control clean-input pass-name" placeholder="Full Name" required></td>
                <td><input type="number" class="form-control clean-input pass-age" placeholder="Age" min="1" max="120" required></td>
                <td class="berth-col ${selectedTrainType === 'LOCAL' ? 'd-none' : ''}">
                    <select class="form-select clean-input pass-berth">
                        <option value="">No Preference</option>
                        <option value="LB">Lower</option>
                        <option value="MB">Middle</option>
                        <option value="UB">Upper</option>
                    </select>
                </td>
                <td class="text-center">
                    <button type="button" class="btn btn-outline-danger btn-sm remove-pass-btn"><i class="bi bi-trash"></i></button>
                </td>
            `;
            tbody.appendChild(tr);

            tr.querySelector('.remove-pass-btn').addEventListener('click', function() {
                tbody.removeChild(tr);
            });
        });

        // Autocomplete Logic
        let debounceTimer;
        document.querySelectorAll('.autocomplete-input').forEach(input => {
            const fetchAutocomplete = function() {
                const targetId = this.getAttribute('data-target');
                const list = document.getElementById(targetId);
                const q = this.value.trim();
                
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    if (q === '') {
                        list.innerHTML = '<li class="dropdown-header text-railway fw-bold"><i class="bi bi-star-fill text-warning me-1"></i> Popular Stations</li>';
                        list.classList.add('show');
                        return;
                    }
                    fetch(`http://127.0.0.1:8000/api/stations/autocomplete/?q=${q}`)
                        .then(res => res.json())
                        .then(data => {
                            list.innerHTML = '';
                            if(data.length === 0 || !data.data) {
                                list.classList.remove('show');
                                return;
                            }
                            
                            // Add a subtle header if it's the default list
                            if(q === '') {
                                list.innerHTML = '<li class="dropdown-header text-railway fw-bold"><i class="bi bi-star-fill text-warning me-1"></i> Popular Stations</li>';
                            }
                            // Add matching stations
                            data.data.forEach(st => {
                                const li = document.createElement('li');
                                const cityStr = st.city ? `<span class="text-muted small"> (${st.city})</span>` : '';
                                li.innerHTML = `<a class="dropdown-item py-2" href="#"><span class="fw-bold text-dark">${st.code}</span> - <span class="text-muted small">${st.name}</span>${cityStr}</a>`;
                                li.addEventListener('click', (e) => {
                                    e.preventDefault();
                                    input.value = st.code;
                                    list.classList.remove('show');
                                });
                                list.appendChild(li);
                            });

                            // Add popular trains if available
                            if (data.popular_trains && data.popular_trains.length > 0) {
                                list.innerHTML += '<li><hr class="dropdown-divider"></li>';
                                list.innerHTML += `<li class="dropdown-header text-railway fw-bold"><i class="bi bi-fire text-danger me-1"></i> Popular Trains (from ${data.target_station || 'here'})</li>`;
                                data.popular_trains.forEach(t => {
                                    const li = document.createElement('li');
                                    li.innerHTML = `<span class="dropdown-item py-1 disabled"><span class="fw-bold text-dark">${t.number}</span> - <span class="text-muted small">${t.name}</span></span>`;
                                    list.appendChild(li);
                                });
                            }

                            list.classList.add('show');
                        })
                        .catch(err => console.error("Autocomplete failed:", err));
                }, 200);
            };

            input.addEventListener('input', fetchAutocomplete);
            input.addEventListener('focus', fetchAutocomplete);
            
            // Hide dropdown when clicking outside
            document.addEventListener('click', (e) => {
                if(!input.contains(e.target)) {
                    document.getElementById(input.getAttribute('data-target')).classList.remove('show');
                }
            });
        });

        // Search Trains
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const src = document.getElementById('source').value.toUpperCase();
            const dst = document.getElementById('destination').value.toUpperCase();
            const btn = document.getElementById('searchBtn');
            const tbody = document.getElementById('trainsBody');
            const tableContainer = document.getElementById('trainsList');
            const err = document.getElementById('searchError');
            
            // Hide previous results and errors
            document.getElementById('bookSection').classList.add('d-none');
            err.classList.add('d-none');

            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Searching...';
            btn.disabled = true;

            fetch(`http://127.0.0.1:8000/api/railway/trains/between/?from=${src}&to=${dst}`)
                .then(async res => {
                    const data = await res.json();
                    if(!res.ok) throw new Error(data.error || "Failed to search trains");
                    return data;
                })
                .then(data => {
                    btn.innerText = "Search Trains";
                    btn.disabled = false;
                    
                    if(!data.success || data.data.length === 0) {
                        err.innerHTML = `<i class="bi bi-exclamation-circle me-2"></i>No trains found between <b>${src}</b> and <b>${dst}</b>.`;
                        err.classList.remove('d-none');
                        tableContainer.classList.add('d-none');
                        return;
                    }

                    tableContainer.classList.remove('d-none');
                    tbody.innerHTML = '';
                    
                    let badgeClass = data.meta.source === 'external_api' ? 'data-badge-live' : 'data-badge-local';
                    let badgeText = data.meta.source === 'external_api' ? 'LIVE DATA' : 'LOCAL DATABASE';
                    let sourceBadge = `<span class="data-badge ${badgeClass} ms-2"><div class="data-indicator"></div> ${badgeText}</span>`;
                    document.querySelector('#trainsList .card-header h5').innerHTML = `<i class="bi bi-list-ul me-2 text-railway"></i> Available Trains ${sourceBadge}`;
                    
                    data.data.forEach(train => {
                        const tr = document.createElement('tr');
                        const isLocal = train.normalized_type === 'LOCAL';
                        const badgeType = isLocal ? 'bg-primary' : 'bg-danger';
                        
                        tr.innerHTML = `
                            <td>
                                <span class="fw-bold text-railway">${train.name}</span> <span class="badge ${badgeType} ms-1">${train.type}</span><br>
                                <span class="text-muted small fw-bold">#${train.number}</span>
                            </td>
                            <td class="fw-bold">${train.departure_time || 'N/A'}</td>
                            <td class="fw-bold text-success">
                                <i class="bi bi-arrow-down d-block text-center small text-muted"></i>
                                <span class="badge bg-light text-dark d-block border">${train.duration || 'N/A'}</span>
                            </td>
                            <td class="fw-bold">${train.arrival_time || 'N/A'}</td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-primary fw-bold select-train-btn px-2 me-1" data-id="${train.number}" data-name="${train.name}" data-type="${train.type}">Book</button>
                                <button class="btn btn-sm btn-outline-info fw-bold view-route-btn px-2 me-1" data-id="${train.number}" data-name="${train.name}">Route</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });

                    document.querySelectorAll('.select-train-btn').forEach(button => {
                        button.addEventListener('click', function() {
                            selectedTrainId = this.getAttribute('data-id');
                            selectedTrainType = this.getAttribute('data-type');
                            selectedSrc = src;
                            selectedDst = dst;
                            
                            document.getElementById('selectedTrainTitle').innerText = `Train: ${this.getAttribute('data-name')} [${selectedTrainType}]`;
                            document.getElementById('selectedRouteInfo').innerText = `${src} ➔ ${dst}`;
                            
                            // Adjust UI for LOCAL vs EXPRESS
                            const classSelector = document.getElementById('classSelectorContainer');
                            const berthCols = document.querySelectorAll('.berth-col');
                            
                            if(selectedTrainType === 'LOCAL') {
                                classSelector.classList.add('d-none');
                                berthCols.forEach(col => col.classList.add('d-none'));
                            } else {
                                classSelector.classList.remove('d-none');
                                berthCols.forEach(col => col.classList.remove('d-none'));
                                
                                // Fetch dynamic classes
                                const tc = document.getElementById('ticketClass');
                                tc.innerHTML = '<option>Loading...</option>';
                                fetch(`http://127.0.0.1:8000/api/railway/trains/${selectedTrainId}/classes/`)
                                    .then(r => r.json())
                                    .then(d => {
                                        tc.innerHTML = '';
                                        if(d.success && d.data.classes.length > 0) {
                                            d.data.classes.forEach(c => {
                                                tc.innerHTML += `<option value="${c}">${c}</option>`;
                                            });
                                        } else {
                                            tc.innerHTML = '<option value="GN">General (GN)</option>';
                                        }
                                    }).catch(e => {
                                        tc.innerHTML = '<option value="SL">Sleeper (SL)</option><option value="3A">AC 3-Tier (3A)</option>';
                                    });
                            }
                            
                            document.getElementById('bookSection').classList.remove('d-none');
                            
                            document.getElementById('bookSection').scrollIntoView({behavior: 'smooth', block: 'start'});
                        });
                    });

                    document.querySelectorAll('.view-route-btn').forEach(button => {
                        button.addEventListener('click', function() {
                            const tNo = this.getAttribute('data-id');
                            const tName = this.getAttribute('data-name');
                            document.getElementById('routeModalTitle').innerText = `Route: ${tName} (${tNo})`;
                            
                            const routeModal = new bootstrap.Modal(document.getElementById('routeModal'));
                            routeModal.show();

                            const rList = document.getElementById('routeList');
                            const rLoading = document.getElementById('routeLoading');
                            rList.innerHTML = '';
                            rLoading.classList.remove('d-none');

                            fetch(`http://127.0.0.1:8000/api/railway/trains/${tNo}/schedule-v2/`)
                                .then(res => res.json())
                                .then(data => {
                                    rLoading.classList.add('d-none');
                                    if(!data.success) {
                                        rList.innerHTML = `<li class="list-group-item text-danger fw-bold text-center">${data.error || 'Failed to load route.'}</li>`;
                                        return;
                                    }
                                    
                                    let routeBadgeClass = data.meta.source === 'external_api' ? 'data-badge-live' : 'data-badge-local';
                                    let routeBadgeText = data.meta.source === 'external_api' ? 'LIVE DATA' : 'LOCAL DATABASE';
                                    const sourceBadge = `<span class="data-badge ${routeBadgeClass} ms-2 fs-7"><div class="data-indicator"></div> ${routeBadgeText}</span>`;
                                    document.getElementById('routeModalTitle').innerHTML = `Route: ${tName} (${tNo}) ${sourceBadge}`;
                                    
                                    data.data.stations.forEach((st, idx) => {
                                        const isFirst = idx === 0;
                                        const isLast = idx === data.data.stations.length - 1;
                                        const icon = isFirst ? 'bi-circle-fill text-success' : isLast ? 'bi-geo-alt-fill text-danger' : 'bi-arrow-down-circle text-primary';
                                        
                                        rList.innerHTML += `
                                            <li class="list-group-item d-flex align-items-center py-3">
                                                <i class="bi ${icon} fs-4 me-3"></i>
                                                <div>
                                                    <div class="fw-bold fs-5">${st.station_name}</div>
                                                    <div class="text-muted small fw-bold text-uppercase">${st.station_code} • ${st.distance} KM</div>
                                                </div>
                                            </li>
                                        `;
                                    });
                                })
                                .catch(err => {
                                    rLoading.classList.add('d-none');
                                    rList.innerHTML = `<li class="list-group-item text-danger fw-bold text-center">Failed to load route.</li>`;
                                });
                        });
                    });
                })
                .catch(error => {
                    btn.innerText = "Search Trains";
                    btn.disabled = false;
                    err.innerText = error.message;
                    err.classList.remove('d-none');
                    tableContainer.classList.add('d-none');
                });
        });

        // Confirm Booking & Extract Passengers
        let currentBookingId = null;
        
        document.getElementById('bookForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if(!selectedTrainId) return;

            const btn = document.getElementById('confirmBookBtn');
            const errDiv = document.getElementById('bookError');
            
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing...';
            btn.disabled = true;
            
            const passengers = [];
            document.querySelectorAll('.passenger-row').forEach(row => {
                const name = row.querySelector('.pass-name').value;
                const age = row.querySelector('.pass-age').value;
                const berth = row.querySelector('.pass-berth').value;
                if(name && age) {
                    passengers.push({
                        name: name,
                        age: parseInt(age),
                        berth_preference: berth,
                        gender: 'Unknown'
                    });
                }
            });

            if(passengers.length === 0) {
                errDiv.innerText = "Please add at least one valid passenger.";
                errDiv.classList.remove('d-none');
                btn.innerText = "Confirm Booking";
                btn.disabled = false;
                return;
            }

            const payload = {
                train_number: selectedTrainId,
                source_code: selectedSrc, 
                destination_code: selectedDst,
                date_of_journey: document.getElementById('journeyDate') ? document.getElementById('journeyDate').value : new Date().toISOString().split('T')[0],
                ticket_class: selectedTrainType !== 'LOCAL' ? document.getElementById('ticketClass').value : '',
                passengers: passengers
            };

            fetch('http://127.0.0.1:8000/api/bookings/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('access_token')}`
                },
                body: JSON.stringify(payload)
            })
            .then(async res => {
                const data = await res.json();
                if(!res.ok) throw new Error(data.error || JSON.stringify(data));
                return data;
            })
            .then(data => {
                errDiv.classList.add('d-none');
                btn.innerText = "Confirm Booking";
                btn.disabled = false;
                
                // Redirect to payment page
                window.location.href = `payment.html?id=${data.id}`;
            })
            .catch(error => {
                btn.innerText = "Confirm Booking";
                btn.disabled = false;
                errDiv.innerText = error.message;
                errDiv.classList.remove('d-none');
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<div id="footer-container"></div>
<script src="../../js/components.js"></script>
</body>
</html>
