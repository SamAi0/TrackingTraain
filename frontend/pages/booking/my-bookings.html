<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | TrackEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="../../css/premium.css" rel="stylesheet">
    <script src="../../js/auth.js"></script>
</head>
<body class="bg-light">

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-dark"><i class="bi bi-journal-text me-2"></i>My Bookings</h3>
        </div>

        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-railway" role="status"></div>
            <p class="mt-3 fw-bold text-muted">Fetching your bookings...</p>
        </div>

        <div id="noBookings" class="alert alert-info text-center fw-bold d-none p-5">
            <i class="bi bi-calendar-x fs-1 d-block mb-3"></i>
            You don't have any bookings yet.
            <div class="mt-3"><a href="book.html" class="btn btn-primary">Book a Ticket Now</a></div>
        </div>

        <div class="row" id="bookingsContainer">
            <!-- Populated dynamically -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('access_token');
            if(!token) {
                window.location.href = "../auth/login.html";
                return;
            }

            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.removeItem('access_token');
                window.location.href = '../auth/login.html';
            });

            fetch('http://127.0.0.1:8000/api/bookings/', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').classList.add('d-none');
                
                if(data.length === 0) {
                    document.getElementById('noBookings').classList.remove('d-none');
                    return;
                }

                const container = document.getElementById('bookingsContainer');
                data.forEach(booking => {
                    const isConfirmed = booking.status === 'CONFIRMED';
                    const badgeClass = isConfirmed ? 'bg-success' : 'bg-warning text-dark';
                    const pnr = booking.pnr_record?.pnr_number || 'N/A';
                    
                    let actionButtons = '';
                    if(isConfirmed) {
                        actionButtons = `
                            <a href="ticket.html?booking_id=${booking.id}" class="btn btn-sm btn-outline-primary fw-bold me-1"><i class="bi bi-ticket me-1"></i>Ticket</a>
                            <a href="invoice.html?booking_id=${booking.id}" class="btn btn-sm btn-outline-dark fw-bold me-1"><i class="bi bi-receipt me-1"></i>Invoice</a>
                            <a href="../tracking/track.html?train=${booking.train_details.number}" class="btn btn-sm btn-outline-success fw-bold"><i class="bi bi-geo-alt me-1"></i>Track</a>
                        `;
                    } else if(booking.status === 'PENDING') {
                        actionButtons = `
                            <a href="payment.html?id=${booking.id}" class="btn btn-sm btn-primary fw-bold"><i class="bi bi-credit-card me-1"></i>Pay Now</a>
                        `;
                    }

                    const card = document.createElement('div');
                    card.className = "col-lg-6 mb-4";
                    card.innerHTML = `
                        <div class="clean-card p-4 h-100 shadow-sm border-0">
                            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
                                <div>
                                    <span class="badge ${badgeClass} fs-6 mb-1">${booking.status}</span>
                                    <span class="badge ${booking.train_type === 'LOCAL' ? 'bg-primary' : 'bg-danger'} ms-1 mb-1">${booking.train_type}</span>
                                    <div class="text-muted small fw-bold">Booking ID: ${booking.id}</div>
                                </div>
                                <div class="text-end">
                                    <h5 class="fw-bold mb-0 text-dark">PNR: ${pnr}</h5>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-6">
                                    <span class="small text-muted fw-bold">Journey Route</span>
                                    <div class="fw-bold text-dark fs-5">${booking.source_station.code} ➔ ${booking.destination_station.code}</div>
                                </div>
                                <div class="col-6 text-end">
                                    <span class="small text-muted fw-bold">Journey Date</span>
                                    <div class="fw-bold text-dark fs-5">${booking.date_of_journey}</div>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-6">
                                    <span class="small text-muted fw-bold">Train</span>
                                    <div class="fw-bold text-dark">${booking.train_details.number}</div>
                                </div>
                                <div class="col-6 text-end">
                                    <span class="small text-muted fw-bold">Total Fare</span>
                                    <div class="fw-bold text-success fs-5">₹${booking.total_fare}</div>
                                </div>
                            </div>
                            
                            <div class="d-flex mt-4 pt-3 border-top justify-content-end">
                                ${actionButtons}
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('loading').innerHTML = `<div class="alert alert-danger">Error loading bookings: ${err.message}</div>`;
            });
        });
    </script>
<div id="footer-container"></div>
<script src="../../js/components.js"></script>
</body>
</html>
