<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNR Status Enquiry | TrackEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="../../css/premium.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <!-- Search Box -->
                <div class="clean-card p-5 mb-4 text-center">
                    <h3 class="fw-bold text-railway mb-3">Passenger Name Record (PNR) Enquiry</h3>
                    <p class="text-muted mb-4">Enter the 10-digit PNR printed on the top left corner of your ticket.</p>
                    
                    <form id="pnrForm" class="mx-auto" style="max-width: 500px;">
                        <div class="input-group">
                            <input type="text" class="form-control clean-input text-center fs-5 fw-bold letter-spacing-1" id="pnrNumber" placeholder="Enter PNR Number" maxlength="10" required>
                            <button class="btn btn-railway px-4" type="submit" id="pnrBtn">Submit</button>
                        </div>
                    </form>
                </div>

                <!-- Error Alert -->
                <div id="apiError" class="alert alert-danger clean-card fw-bold text-center d-none"></div>

                <!-- Ticket Result -->
                <div id="pnrResult" class="d-none">
                    <div class="ticket-card">
                        <div class="ticket-header d-flex justify-content-between align-items-center">
                            <div>
                                <span class="small text-white-50 text-uppercase letter-spacing-1">PNR Number</span>
                                <h4 class="mb-0 fw-bold" id="resPnr">-</h4>
                            </div>
                            <div class="text-end">
                                <span class="small text-white-50 text-uppercase letter-spacing-1">Booking Date</span>
                                <h6 class="mb-0 fw-bold" id="resDate">-</h6>
                            </div>
                        </div>
                        
                        <div class="ticket-body">
                            <!-- Train Info -->
                            <div class="row text-center mb-2">
                                <div class="col-12">
                                    <h4 class="fw-bold text-railway mb-1" id="resTrain">Train Name (12345)</h4>
                                </div>
                            </div>
                            
                            <div class="row text-center align-items-center my-4">
                                <div class="col-5">
                                    <h2 class="fw-bold text-dark mb-0">SRC</h2>
                                    <p class="text-muted small fw-bold text-uppercase mb-0" id="resSrc">Source Station</p>
                                </div>
                                <div class="col-2">
                                    <i class="bi bi-arrow-right fs-3 text-muted"></i>
                                </div>
                                <div class="col-5">
                                    <h2 class="fw-bold text-dark mb-0">DST</h2>
                                    <p class="text-muted small fw-bold text-uppercase mb-0" id="resDest">Destination Station</p>
                                </div>
                            </div>
                            
                            <div class="ticket-divider"></div>
                            
                            <!-- Journey Info -->
                            <div class="row text-center mb-4">
                                <div class="col-6 border-end">
                                    <span class="text-muted small text-uppercase fw-bold">Class</span>
                                    <h5 class="fw-bold mt-1 text-dark" id="resClass">SL</h5>
                                </div>
                                <div class="col-6">
                                    <span class="text-muted small text-uppercase fw-bold">Current Status</span>
                                    <div class="mt-1">
                                        <span class="badge badge-cnf fs-6 px-3 py-2" id="resStatus">CNF</span>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Passengers Table -->
                            <div class="mt-4 pt-3">
                                <h6 class="fw-bold text-railway mb-3"><i class="bi bi-people-fill me-2"></i>Passenger Details</h6>
                                <div class="table-responsive">
                                    <table class="table table-clean table-sm table-bordered mb-0">
                                        <thead>
                                            <tr>
                                                <th class="text-center" width="10%">S.No.</th>
                                                <th>Name</th>
                                                <th class="text-center" width="15%">Age</th>
                                                <th class="text-center" width="30%">Booking Status / Coach / Berth</th>
                                            </tr>
                                        </thead>
                                        <tbody id="resPassengers">
                                            <!-- Filled via JS -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            
                            <div class="text-center mt-4">
                                <button class="btn btn-outline-secondary btn-sm" onclick="window.print()"><i class="bi bi-printer me-1"></i> Print Ticket</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        document.getElementById('pnrForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const pnr = document.getElementById('pnrNumber').value;
            const resultDiv = document.getElementById('pnrResult');
            const errorAlert = document.getElementById('apiError');
            const btn = document.getElementById('pnrBtn');

            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
            btn.disabled = true;

            fetch(`http://127.0.0.1:8000/api/pnr/${pnr}/`)
                .then(async response => {
                    const data = await response.json();
                    if(!response.ok) throw new Error(data.error || "PNR details not found. Please verify the number.");
                    return data;
                })
                .then(data => {
                    btn.innerText = "Submit";
                    btn.disabled = false;
                    
                    resultDiv.classList.remove('d-none');
                    errorAlert.classList.add('d-none');

                    document.getElementById('resPnr').innerText = data.pnr_number;
                    document.getElementById('resDate').innerText = data.date_of_journey || '-';
                    
                    document.getElementById('resTrain').innerText = `${data.train.number} - ${data.train.name}`;
                    document.getElementById('resSrc').innerText = data.source.code;
                    document.getElementById('resDest').innerText = data.destination.code;
                    
                    const statusElem = document.getElementById('resStatus');
                    statusElem.innerText = data.status;

                    if(data.status === 'CONFIRMED') {
                        statusElem.className = "badge badge-cnf fs-6 px-3 py-2";
                    } else if (data.status === 'RAC') {
                        statusElem.className = "badge badge-rac fs-6 px-3 py-2";
                    } else {
                        statusElem.className = "badge badge-wl fs-6 px-3 py-2";
                    }

                    const tbody = document.getElementById('resPassengers');
                    tbody.innerHTML = `
                        <tr>
                            <td class="text-center fw-bold">1</td>
                            <td>${data.passenger_name}</td>
                            <td class="text-center">${data.passenger_age}</td>
                            <td class="text-center fw-bold text-success">${data.status} / ${data.seat_number}</td>
                        </tr>
                    `;
                })
                .catch(error => {
                    btn.innerText = "Submit";
                    btn.disabled = false;
                    resultDiv.classList.add('d-none');
                    errorAlert.innerText = error.message;
                    errorAlert.classList.remove('d-none');
                });
        });
    </script>
<div id="footer-container"></div>
<script src="../../js/components.js"></script>
</body>
</html>
