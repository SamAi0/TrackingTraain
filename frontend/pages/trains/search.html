<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Trains | TrackEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="../../css/premium.css" rel="stylesheet">
    <style>
        .search-hero {
            background-color: var(--railway-blue);
            color: white;
            padding: 40px 0;
            margin-bottom: -50px;
        }
        .search-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 30px;
            margin-bottom: 40px;
            position: relative;
        }
        .autocomplete-list {
            position: absolute;
            z-index: 1000;
            width: 100%;
            background: white;
            border: 1px solid #ddd;
            border-radius: 0 0 8px 8px;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: none;
        }
        .autocomplete-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }
        .autocomplete-item:hover {
            background-color: #f8f9fa;
        }
        .train-card {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .train-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            border-color: #ddd;
            color: inherit;
        }
        .time-display {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .station-display {
            font-size: 0.9rem;
            color: #666;
        }
        .duration-badge {
            background: #f0f0f0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #555;
            display: inline-block;
        }
        .type-badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .type-EXPRESS { background: #e3f2fd; color: #1565c0; }
        .type-SUPERFAST { background: #ffebee; color: #c62828; }
        .type-LOCAL { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--railway-blue);">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../../index.html">
                <i class="bi bi-train-front me-2"></i>TrackEase
            </a>
        </div>
    </nav>

    <div class="search-hero">
        <div class="container">
            <h1 class="mb-2">Find Your Train</h1>
            <p class="opacity-75">Search across 5,200+ trains and 8,900+ stations</p>
        </div>
    </div>

    <div class="container">
        <div class="search-card">
            <form id="searchForm" class="row g-3">
                <div class="col-md-4 position-relative">
                    <label class="form-label text-muted fw-semibold">From Station</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-geo-alt text-primary"></i></span>
                        <input type="text" class="form-control form-control-lg" id="sourceInput" placeholder="Enter source station" autocomplete="off" required>
                    </div>
                    <div id="sourceAutocomplete" class="autocomplete-list"></div>
                    <input type="hidden" id="sourceCode">
                </div>
                
                <div class="col-md-1 d-flex align-items-end justify-content-center pb-2">
                    <button type="button" class="btn btn-light rounded-circle p-2" id="swapBtn" style="border: 1px solid #ddd;">
                        <i class="bi bi-arrow-left-right"></i>
                    </button>
                </div>
                
                <div class="col-md-4 position-relative">
                    <label class="form-label text-muted fw-semibold">To Station</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-geo text-danger"></i></span>
                        <input type="text" class="form-control form-control-lg" id="destInput" placeholder="Enter destination" autocomplete="off" required>
                    </div>
                    <div id="destAutocomplete" class="autocomplete-list"></div>
                    <input type="hidden" id="destCode">
                </div>
                
                <div class="col-md-3">
                    <label class="form-label text-muted fw-semibold">Date of Journey</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-calendar3"></i></span>
                        <input type="date" class="form-control form-control-lg" id="dateInput">
                    </div>
                </div>
                
                <div class="col-12 text-center mt-4">
                    <button type="submit" class="btn btn-lg px-5 text-white" style="background-color: var(--accent-orange); font-weight: 600;">
                        <i class="bi bi-search me-2"></i> Search Trains
                    </button>
                </div>
            </form>
        </div>

        <div id="loadingIndicator" class="text-center d-none my-5">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3 text-muted">Searching the railway network...</p>
        </div>

        <div id="resultsHeader" class="mb-4 d-none">
            <h4 class="fw-bold"><span id="resultCount">0</span> Trains Found</h4>
            <p class="text-muted mb-0">From <span id="resSource" class="fw-semibold"></span> to <span id="resDest" class="fw-semibold"></span></p>
        </div>

        <div id="resultsContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/train_search.js"></script>
</body>
</html>
