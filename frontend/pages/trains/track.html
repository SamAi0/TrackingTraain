<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Train Tracking | TrackEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="../../css/premium.css" rel="stylesheet">
    <style>
        .header-section {
            background-color: var(--railway-blue);
            color: white;
            padding: 30px 0;
            position: relative;
        }
        .demo-badge {
            background-color: #ffc107;
            color: #000;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .status-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #eaeaea;
            overflow: hidden;
        }
        .status-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid #eaeaea;
            padding: 15px 20px;
        }
        .status-ON_TIME { color: #28a745; font-weight: bold; }
        .status-DELAYED { color: #dc3545; font-weight: bold; }
        .status-HALTED { color: #fd7e14; font-weight: bold; }
        .status-COMPLETED { color: #6f42c1; font-weight: bold; }
        
        .progress-bar-container {
            height: 10px;
            background-color: #e9ecef;
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: var(--accent-orange);
            transition: width 0.5s ease;
        }
        
        .map-container {
            height: calc(100vh - 200px);
            min-height: 500px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: sticky;
            top: 20px;
        }
        
        .route-progress {
            position: relative;
            padding-left: 25px;
            margin-top: 20px;
        }
        .route-progress::before {
            content: '';
            position: absolute;
            left: 11px;
            top: 10px;
            bottom: 10px;
            width: 3px;
            background-color: #e9ecef;
        }
        .route-item {
            position: relative;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: white;
            border: 1px solid #eee;
        }
        .route-item::before {
            content: '';
            position: absolute;
            left: -19px;
            top: 18px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            z-index: 1;
            background: white;
            border: 2px solid #ccc;
        }
        
        .route-item.completed::before { border-color: #28a745; background-color: #28a745; }
        .route-item.completed { opacity: 0.7; }
        
        .route-item.current {
            border: 2px solid var(--accent-orange);
            box-shadow: 0 4px 10px rgba(242, 100, 34, 0.15);
        }
        .route-item.current::before {
            border-color: var(--accent-orange);
            background-color: white;
            width: 15px;
            height: 15px;
            left: -21px;
            top: 16px;
            border-width: 4px;
        }
        
        .route-item.upcoming::before { border-color: #0dcaf0; }
        
        .time-box {
            font-family: monospace;
            background: #f8f9fa;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #e9ecef;
            font-size: 0.9rem;
        }
        
        @media (max-width: 991.98px) {
            .map-container {
                height: 400px;
                position: relative;
                top: 0;
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--railway-blue);">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../../index.html">
                <i class="bi bi-train-front me-2"></i>TrackEase
            </a>
            <span class="demo-badge ms-auto"><i class="bi bi-info-circle me-1"></i> Demo • Simulated Live Data</span>
        </div>
    </nav>

    <div class="header-section">
        <div class="container">
            <form id="trackForm" class="row g-2 justify-content-center mb-2">
                <div class="col-md-5">
                    <input type="text" class="form-control form-control-lg" id="trainInput" placeholder="Enter Train Number (e.g., 12951)" required>
                </div>
                <div class="col-md-3">
                    <select class="form-select form-select-lg" id="delaySelect">
                        <option value="0">On Time (0 min delay)</option>
                        <option value="15">Delayed (15 min)</option>
                        <option value="45">Highly Delayed (45 min)</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-lg w-100 text-white" style="background-color: var(--accent-orange);">Track</button>
                </div>
            </form>
        </div>
    </div>

    <div class="container mt-4 mb-5">
        <div id="loadingIndicator" class="text-center d-none my-5">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3 text-muted">Locating train on network...</p>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none"></div>

        <div class="row" id="contentRow" style="display: none;">
            <div class="col-lg-5 mb-4 order-2 order-lg-1">
                <!-- Status Card -->
                <div class="status-card mb-4">
                    <div class="status-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold" id="trainTitle">Train</h5>
                        <span id="trainStatus" class="fs-5">STATUS</span>
                    </div>
                    <div class="card-body p-4">
                        <div class="row mb-3 text-center">
                            <div class="col-4">
                                <small class="text-muted d-block">Previous</small>
                                <strong id="prevStn" class="d-block text-truncate">--</strong>
                            </div>
                            <div class="col-4 border-start border-end">
                                <small class="text-primary fw-bold d-block">Current</small>
                                <strong id="currStn" class="d-block text-truncate fs-5 text-primary">--</strong>
                            </div>
                            <div class="col-4">
                                <small class="text-muted d-block">Next</small>
                                <strong id="nextStn" class="d-block text-truncate">--</strong>
                            </div>
                        </div>
                        
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill" id="progressBar" style="width: 0%;"></div>
                        </div>
                        
                        <div class="row text-center mt-3">
                            <div class="col-6">
                                <small class="text-muted d-block">Expected Arrival</small>
                                <span class="fs-5 fw-semibold" id="expArr">--:--</span>
                            </div>
                            <div class="col-6 border-start">
                                <small class="text-muted d-block">Expected Departure</small>
                                <span class="fs-5 fw-semibold" id="expDep">--:--</span>
                            </div>
                        </div>
                        <div class="text-center mt-3">
                            <small class="text-muted"><i class="bi bi-arrow-clockwise me-1"></i>Last Updated: <span id="lastUpdated"></span></small>
                        </div>
                    </div>
                </div>

                <!-- Route Progress -->
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3">
                        <h6 class="card-title mb-0 fw-bold"><i class="bi bi-geo-alt me-2"></i> Route Progress</h6>
                    </div>
                    <div class="card-body p-3" style="max-height: 500px; overflow-y: auto;">
                        <div class="route-progress" id="routeProgressContainer">
                            <!-- Items injected via JS -->
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-7 order-1 order-lg-2">
                <div id="map" class="map-container"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../../js/train_tracking.js"></script>
</body>
</html>
