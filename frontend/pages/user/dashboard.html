<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard | TrackEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="../../css/premium.css" rel="stylesheet">
    <script src="../../js/auth.js"></script>
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <div class="container mt-4 mb-5">
        <div class="row mb-4">
            <div class="col-12">
                <h3 class="fw-bold text-railway mb-1" id="welcomeMsg">Welcome, Passenger!</h3>
                <p class="text-muted">Manage your bookings and view upcoming journeys.</p>
            </div>
        </div>

        <div class="row">
            <!-- Sidebar Actions -->
            <div class="col-md-3 mb-4">
                <div class="clean-card p-3 mb-3">
                    <h6 class="fw-bold text-dark border-bottom pb-2 mb-3">Quick Actions</h6>
                    <a href="../booking/book.html" class="btn btn-railway w-100 text-start mb-2"><i class="bi bi-plus-circle me-2"></i> Book Ticket</a>
                    <a href="../pnr/status.html" class="btn btn-outline-secondary w-100 text-start mb-2"><i class="bi bi-ticket-detailed me-2"></i> Check PNR</a>
                    <a href="../tracking/track.html" class="btn btn-outline-secondary w-100 text-start"><i class="bi bi-geo-alt me-2"></i> Track Train</a>
                </div>
            </div>

            <!-- Dashboard Content -->
            <div class="col-md-9">
                <div class="clean-card">
                    <div class="card-header bg-white border-bottom py-3">
                        <h5 class="fw-bold text-dark mb-0"><i class="bi bi-journal-check text-railway me-2"></i> My Bookings</h5>
                    </div>
                    <div class="card-body p-4">
                        <div id="loadingBookings" class="text-center py-4">
                            <div class="spinner-border text-railway" role="status"></div>
                            <p class="mt-2 text-muted">Loading your bookings...</p>
                        </div>
                        
                        <div id="errorBookings" class="alert alert-danger d-none fw-bold text-center"></div>
                        <div id="emptyBookings" class="text-center py-5 d-none">
                            <i class="bi bi-calendar-x text-muted mb-3" style="font-size: 3rem;"></i>
                            <h5 class="fw-bold text-dark">No Bookings Found</h5>
                            <p class="text-muted">You haven't booked any tickets yet.</p>
                            <a href="../booking/book.html" class="btn btn-railway px-4 mt-2">Plan a Journey</a>
                        </div>
                        
                        <div id="bookingsList" class="d-none">
                            <!-- Populated via JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('access_token');
            if(!token) {
                window.location.href = '../auth/login.html';
                return;
            }

            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                window.location.href = '../auth/login.html';
            });

            fetchBookings();
        });

        function fetchBookings() {
            const token = localStorage.getItem('access_token');
            const loading = document.getElementById('loadingBookings');
            const error = document.getElementById('errorBookings');
            const empty = document.getElementById('emptyBookings');
            const list = document.getElementById('bookingsList');

            fetch('http://127.0.0.1:8000/api/bookings/', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(async res => {
                const data = await res.json();
                if(!res.ok) throw new Error("Failed to fetch bookings. Your session may have expired.");
                return data;
            })
            .then(data => {
                loading.classList.add('d-none');
                
                if(data.length === 0) {
                    empty.classList.remove('d-none');
                    return;
                }
                
                list.classList.remove('d-none');
                list.innerHTML = '';
                
                // Assuming data is array of bookings
                data.forEach(booking => {
                    const status = booking.pnr_record ? booking.pnr_record.status : booking.status;
                    const statusBadge = status === 'CONFIRMED' ? 'badge-cnf' : 
                                      status === 'CANCELLED' ? 'badge-cancelled' : 'bg-warning text-dark';
                                      
                    const card = document.createElement('div');
                    card.className = "ticket-card mb-4";
                    card.innerHTML = `
                        <div class="ticket-header d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="fw-bold mb-0">${booking.train_details.name} (${booking.train_details.number})</h5>
                            </div>
                            <div class="text-end">
                                <span class="badge ${statusBadge} px-3 py-2 border border-light">${status}</span>
                            </div>
                        </div>
                        <div class="ticket-body py-3">
                            <div class="row align-items-center">
                                <div class="col-md-3 text-center border-end">
                                    <h6 class="text-muted text-uppercase small fw-bold mb-1">PNR Number</h6>
                                    <h4 class="fw-bold text-railway mb-0">${booking.pnr_record ? booking.pnr_record.pnr_number : 'PENDING'}</h4>
                                </div>
                                <div class="col-md-6 px-4">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <div class="fw-bold text-dark fs-5">${booking.source_station.code}</div>
                                        <i class="bi bi-arrow-right text-muted fs-4"></i>
                                        <div class="fw-bold text-dark fs-5">${booking.destination_station.code}</div>
                                    </div>
                                    <div class="text-center text-muted small fw-bold">
                                        Booking Date: ${new Date(booking.booking_date).toLocaleDateString()}
                                    </div>
                                </div>
                                <div class="col-md-3 text-center border-start">
                                    <a href="../pnr/status.html?pnr=${booking.pnr_record ? booking.pnr_record.pnr_number : ''}" class="btn btn-outline-primary btn-sm fw-bold mb-2 w-100 ${booking.pnr_record ? '' : 'disabled'}">View Ticket</a>
                                    <a href="../tracking/track.html?train=${booking.train_details.number}" class="btn btn-outline-success btn-sm fw-bold w-100">Track Train</a>
                                </div>
                            </div>
                        </div>
                    `;
                    list.appendChild(card);
                });
            })
            .catch(err => {
                loading.classList.add('d-none');
                error.innerText = err.message;
                error.classList.remove('d-none');
            });
        }
    </script>
<div id="footer-container"></div>
<script src="../../js/components.js"></script>
</body>
</html>
